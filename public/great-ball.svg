<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="great-ball">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#great-ball)">
    <!-- Full circle base (white bottom) -->
    <circle cx="50" cy="50" r="50" fill="#F5F5F5"/>
    <!-- Top royal-blue half -->
    <path d="M 0 50 A 50 50 0 0 1 100 50 Z" fill="#0075FF"/>
    <rect x="-7" y="-12" width="14" height="24" rx="4" fill="#EE0000" transform="translate(18, 18) rotate(-45)"/>
    <rect x="-7" y="-12" width="14" height="24" rx="4" fill="#EE0000" transform="translate(82, 18) rotate(45)"/>
    <!-- Middle black band -->
    <rect x="0" y="44" width="100" height="12" fill="black"/>
    <!-- Central button -->
    <circle cx="50" cy="50" r="14" fill="#F5F5F5" stroke="black" stroke-width="4"/>
    <circle cx="50" cy="50" r="6" fill="black"/>
  </g>
  <!-- Outer black ring -->
  <circle cx="50" cy="50" r="49" fill="none" stroke="black" stroke-width="2"/>
</svg>
