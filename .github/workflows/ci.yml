name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Guards the build-time scripts (build_data_api.py, inline_dist.py) that
      # run on every deploy. A syntax error here breaks production, and nothing
      # else in CI would catch it before the deploy job runs.
      - name: Check Python scripts compile
        run: python -m compileall -q scripts/
