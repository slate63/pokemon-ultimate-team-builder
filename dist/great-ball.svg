<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="great-ball">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#great-ball)">
    <!-- Full circle base (white bottom) -->
    <circle cx="50" cy="50" r="50" fill="#F5F5F5"/>
    <!-- Top royal-blue half -->
    <path d="M 0 50 A 50 50 0 0 1 100 50 Z" fill="#0B5ED7"/>
    <!-- Left red stripe: starts at ball edge, 45° from vertical, half length toward center -->
    <path d="M 12 18 L 18 12 L 27 21 L 21 27 Z" fill="#DC3545"/>
    <!-- Right red stripe: mirror, starts at ball edge, 45° from vertical, half length toward center -->
    <path d="M 88 18 L 82 12 L 73 21 L 79 27 Z" fill="#DC3545"/>
    <!-- Middle black band -->
    <rect x="0" y="44" width="100" height="12" fill="black"/>
    <!-- Central button -->
    <circle cx="50" cy="50" r="14" fill="#F5F5F5" stroke="black" stroke-width="4"/>
    <circle cx="50" cy="50" r="6" fill="black"/>
  </g>
  <!-- Outer black ring -->
  <circle cx="50" cy="50" r="49" fill="none" stroke="black" stroke-width="2"/>
</svg>
