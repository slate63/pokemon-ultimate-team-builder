<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="master-ball">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#master-ball)">
    <!-- Full circle base (white bottom) -->
    <circle cx="50" cy="50" r="50" fill="#F5F5F5"/>
    <!-- Top deep-purple half -->
    <path d="M 0 50 A 50 50 0 0 1 100 50 Z" fill="#7E22CE"/>
    <!-- Pink bumps at 45° from top, half off the ball's edge -->
    <circle cx="15" cy="15" r="8.4" fill="#EC4899"/>
    <circle cx="85" cy="15" r="8.4" fill="#EC4899"/>
    <!-- Crisp white "M" centered between the bumps, above the equator -->
    <path d="M 38 40 L 38 18 L 50 32 L 62 18 L 62 40" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Middle black band -->
    <rect x="0" y="44" width="100" height="12" fill="black"/>
    <!-- Central button -->
    <circle cx="50" cy="50" r="14" fill="#F5F5F5" stroke="black" stroke-width="4"/>
    <circle cx="50" cy="50" r="6" fill="black"/>
  </g>
  <!-- Outer black ring -->
  <circle cx="50" cy="50" r="49" fill="none" stroke="black" stroke-width="2"/>
</svg>
